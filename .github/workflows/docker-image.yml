# Builds the bot + dashboard Docker image and publishes it to GitHub's
# container registry (ghcr.io/<owner>/<repo>) on every push to the branches
# below. The VPS pulls new images automatically (see deploy/test/).
#
# Built for both regular (amd64) and ARM (arm64, e.g. Ampere/Graviton/
# Raspberry Pi) servers; Docker picks the right one automatically.
#
#   push to main         -> image tag "latest" (live, once you switch to Docker)
#   push to TEST_BRANCH  -> image tag "test"   (the test bot)
#
# Every build is also tagged with its commit (sha-xxxxxxx) so you can roll
# back to any earlier build.
name: Docker image

on:
  push:
    branches:
      - main
      - claude/kind-bell-m7yoj1
  workflow_dispatch:

env:
  TEST_BRANCH: claude/kind-bell-m7yoj1

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then channel=latest
          elif [ "$GITHUB_REF_NAME" = "$TEST_BRANCH" ]; then channel=test
          else channel="branch-${GITHUB_REF_NAME//\//-}"
          fi
          echo "tags=$image:$channel,$image:sha-$short_sha" >> "$GITHUB_OUTPUT"
          echo "version=$short_sha" >> "$GITHUB_OUTPUT"
          # First line of the commit message, shown in the dashboard's System log.
          echo "title=$(git log -1 --format=%s | tr -d '\r' | cut -c1-200)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COMMIT_TITLE=${{ steps.meta.outputs.title }}
            APP_BUILT_AT=${{ steps.meta.outputs.built_at }}
            APP_REPOSITORY=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
