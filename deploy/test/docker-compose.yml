# Test bot + dashboard. Lives in its own folder on the VPS (e.g.
# /opt/crusader-test) next to:
#   .env                  test bot's settings (copy of the repo's .env.example)
#   deployment_local.py   test server's role/channel/tag IDs
#                         (copy of config/deployment_local.example.py)
#   data/                 everything the bot saves (created automatically)
#   update.sh             pulls new builds (run by cron, see README)
#
# Replace OWNER/REPO below with the lowercase GitHub path, e.g.
# ghcr.io/eg-mike/crusaderdiscordbot:test

services:
  bot:
    image: ghcr.io/OWNER/REPO:test
    container_name: crusader-test
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the container the dashboard listens on all interfaces; the
      # port mapping below still only exposes it on the VPS itself.
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8081"
      WEB_ENVIRONMENT: test
    volumes:
      - ./data:/data
      - ./deployment_local.py:/app/config/deployment_local.py:ro
    ports:
      # 127.0.0.1 = NOT reachable from the internet. Open it from your own
      # computer through an SSH tunnel (see README).
      - "127.0.0.1:8081:8081"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
