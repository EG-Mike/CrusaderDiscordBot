# Test bot + dashboard. Lives in its own folder on the VPS (e.g.
# /opt/crusader-test) next to:
#   .env        the bot's startup settings: Discord token, OAuth client
#               secret, dashboard address, your user ID (see .env.example).
#               Everything else is set in the dashboard's setup guide.
#   data/       everything the bot saves: database, settings, encrypted
#               API keys (+ secret.key, their encryption key - back up both)
#   update.sh   pulls new builds (run by cron, see README)

services:
  bot:
    image: ghcr.io/eg-mike/crusaderdiscordbot:test
    container_name: crusader-test
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the container the dashboard listens on all interfaces; the
      # port mapping below still only exposes it on the VPS itself.
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8081"
      WEB_ENVIRONMENT: test
      WEB_DASHBOARD_ENABLED: "true"
      # Docker brings the bot back after the dashboard's Restart button.
      WEB_RESTART_ENABLED: "true"
      STORAGE_BACKEND: sqlite
    volumes:
      - ./data:/data
      # Optional, for values you'd rather keep in a file than the dashboard:
      # - ./deployment_local.py:/app/config/deployment_local.py:ro
    ports:
      # 127.0.0.1 = NOT reachable from the internet. Open it from your own
      # computer through an SSH tunnel (see README).
      - "127.0.0.1:8081:8081"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
